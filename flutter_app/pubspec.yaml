name: face_attendance_flutter
description: Flutter shell for iPad face attendance kiosk and admin operations.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ios_face_attendance_plugin:
    path: ../ios_native_plugin
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  sqflite_common_ffi_web: ^1.1.1
  camera: ^0.12.0+1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
